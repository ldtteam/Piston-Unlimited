configurations {
    library
    implementation.extendsFrom library
}

repositories {
    maven { url = 'https://files.minecraftforge.net/maven' }
    mavenLocal()
    mavenCentral()
    maven {
        url "https://plugins.gradle.org/m2/"
    }
    maven {
        name 'LDTTeam - Modding'
        url 'https://ldtteam.jfrog.io/ldtteam/modding/'
    }
}

dependencies {
    compileOnly ("com.ldtteam:blockui:${project.blockUiVersion}")
    implementation ("com.ldtteam:blockui:${project.blockUiVersion}")

    implementation ("com.ldtteam:structurize:${project.minecraftVersion}-${project.structurize_version}")

    implementation ("com.ldtteam:domum-ornamentum:${project.domumOrnamentumVersion}")
}
